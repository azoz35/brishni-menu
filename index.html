<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مطعم بريشني</title>
    <style>
        body {
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            background: #f5f5f5;
            direction: rtl;
        }

        header {
            background-color: #8B0000;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            flex-direction: column;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #8B0000;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #8B0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #a30000;
        }

        #burgerLoader {
            display: none;
            font-size: 70px;
            margin-top: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

<header>
    مطعم بريشني 🍽️
</header>

<div class="container">
    <div class="login-box" id="loginBox">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>

    <div id="burgerLoader">🍔</div>
</div>

<script>
    function login() {
        let user = document.getElementById("username").value;
        let pass = document.getElementById("password").value;

        if(user === "العنزي" && pass === "موفق") {
            alert("تم تسجيل الدخول بنجاح!");

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("burgerLoader").style.display = "block";

        } else {
            alert("بيانات الدخول غير صحيحة");
        }
    }
</script>

</body>
</html>
